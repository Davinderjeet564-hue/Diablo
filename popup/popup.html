<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PromptSaver</title>
  <style>
    :root {
      --bg: #0F172A;
      --surface: #1E293B;
      --surface2: #334155;
      --border: #475569;
      --border-subtle: #334155;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #0D9488;
      --accent-hover: #0F766E;
      --danger: #DC2626;
      --danger-hover: #B91C1C;
      --success: #059669;
      --ring: rgba(13,148,136,0.4);
      --radius: 6px;
      --radius-pill: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 200px;
      max-height: 520px;
      overflow-y: auto;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar */
    body::-webkit-scrollbar { width: 6px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }
    body::-webkit-scrollbar-thumb:hover { background: var(--border); }

    /* Focus visible ring */
    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    /* ---- Header ---- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.01em;
    }
    .header h1 .logo-icon {
      display: flex;
      align-items: center;
      color: var(--accent);
    }
    .settings-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease;
      border: none;
      background: none;
    }
    .settings-link:hover {
      color: var(--text);
      background: var(--surface);
    }

    /* ---- Site badge ---- */
    .site-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      margin-bottom: 16px;
      letter-spacing: 0.01em;
    }
    .site-badge.active {
      background: rgba(5, 150, 105, 0.1);
      color: var(--success);
    }
    .site-badge.inactive {
      background: rgba(220, 38, 38, 0.08);
      color: var(--danger);
    }
    .site-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .site-badge.active .dot { background: var(--success); }
    .site-badge.inactive .dot { background: var(--danger); }

    /* ---- Search ---- */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .search-wrap .icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 200ms ease;
    }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* ---- Prompt list ---- */
    .prompt-list { list-style: none; }
    .prompt-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 4px;
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: var(--radius);
      transition: background 150ms ease;
      cursor: default;
    }
    .prompt-item:hover { background: var(--surface2); }
    .prompt-info { flex: 1; min-width: 0; }
    .prompt-name {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .prompt-trigger {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-weight: 500;
      background: var(--surface2);
      border-radius: 4px;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .prompt-actions {
      display: flex;
      gap: 2px;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .prompt-actions button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: var(--radius);
      transition: color 150ms ease, background 150ms ease;
    }
    .prompt-actions button:hover {
      color: var(--text);
      background: var(--surface2);
    }
    .prompt-actions button.delete:hover {
      color: var(--danger);
      background: rgba(220, 38, 38, 0.1);
    }

    /* ---- Empty state ---- */
    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 16px;
    }
    .empty .empty-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--border);
    }
    .empty p {
      font-size: 12px;
      line-height: 1.6;
    }

    /* ---- Footer / Add button ---- */
    .footer {
      margin-top: 12px;
    }
    .btn-add {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 150ms ease;
    }
    .btn-add:hover { background: var(--accent-hover); }
    .btn-add:focus-visible {
      box-shadow: 0 0 0 3px var(--ring);
    }
    .btn-add svg { flex-shrink: 0; }

    /* ---- Quick-add form ---- */
    .quick-add {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
    }
    .quick-add.visible { display: flex; }
    .quick-add label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .quick-add input,
    .quick-add textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 200ms ease;
      resize: vertical;
    }
    .quick-add input::placeholder,
    .quick-add textarea::placeholder { color: var(--text-muted); }
    .quick-add input:focus,
    .quick-add textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .quick-add textarea { min-height: 64px; }
    .quick-add .row {
      display: flex;
      gap: 12px;
    }
    .quick-add .row > div { flex: 1; }
    .quick-add .btn-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .quick-add .btn-row button {
      padding: 7px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 150ms ease;
    }
    .btn-save {
      background: var(--accent);
      color: #fff;
    }
    .btn-save:hover { background: var(--accent-hover); }
    .btn-cancel {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle) !important;
    }
    .btn-cancel:hover {
      background: var(--surface2);
      color: var(--text);
    }

    /* PromptSaver refresh: warm, quiet surfaces with a clear action hierarchy. */
    :root {
      color-scheme: light;
      --bg: #F7F6F1;
      --surface: #FFFFFF;
      --surface2: #F0F3EF;
      --border: #C8D2CC;
      --border-subtle: #E1E6E1;
      --text: #202923;
      --text-muted: #59665E;
      --accent: #0B6B55;
      --accent-hover: #075542;
      --danger: #B42318;
      --danger-hover: #912018;
      --success: #176B45;
      --ring: rgba(11, 107, 85, 0.28);
      --radius: 10px;
      --radius-pill: 999px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      --transition: 150ms ease;
    }

    body {
      width: min(420px, 100vw);
      min-height: 220px;
      max-height: 600px;
      padding: 20px;
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
    }

    body::-webkit-scrollbar-thumb { background: #C8D2CC; }
    body::-webkit-scrollbar-thumb:hover { background: #AAB8AF; }

    :focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    .header {
      margin-bottom: 18px;
      align-items: center;
    }
    .header h1 {
      gap: 10px;
      font-size: 17px;
      font-weight: 720;
      letter-spacing: -0.035em;
    }
    .header h1 .logo-icon {
      width: 34px;
      height: 34px;
      justify-content: center;
      border-radius: 11px;
      background: #E2F0E9;
      color: var(--accent);
    }
    .settings-link {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text-muted);
      transition: color var(--transition), background var(--transition), border-color var(--transition);
    }
    .settings-link:hover {
      color: var(--text);
      background: var(--surface2);
      border-color: var(--border);
    }

    .site-badge {
      display: flex;
      width: fit-content;
      max-width: 100%;
      align-items: center;
      margin: 0 0 18px;
      padding: 7px 12px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .site-badge.active {
      background: #E8F4EC;
      border-color: #C8E4D1;
      color: #155B39;
    }
    .site-badge.inactive {
      background: #F0F1ED;
      border-color: #E0E3DD;
      color: #4F5C53;
    }
    .site-badge .dot { width: 7px; height: 7px; }
    .site-badge.inactive .dot { background: #66756B; }

    .search-wrap { margin-bottom: 14px; }
    .search-wrap .icon { left: 12px; color: #66756B; }
    .search-wrap input {
      min-height: 46px;
      padding: 10px 14px 10px 38px;
      border-color: var(--border-subtle);
      border-radius: 12px;
      background: var(--surface);
      font-size: 13px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .search-wrap input::placeholder { color: #66756B; }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .prompt-list { display: grid; gap: 10px; }
    .prompt-item {
      min-height: 76px;
      padding: 13px 14px 13px 16px;
      margin: 0;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface);
      transition: background var(--transition), border-color var(--transition);
    }
    .prompt-item:hover {
      background: #FBFCFA;
      border-color: #C8D2CC;
    }
    .prompt-name { font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
    .prompt-trigger {
      margin-top: 5px;
      padding: 2px 7px;
      border: 1px solid #D6E8DE;
      border-radius: 6px;
      background: #EFF7F1;
      color: #155B39;
      font-size: 10px;
      letter-spacing: 0;
    }
    .prompt-actions { gap: 6px; margin-left: 10px; }
    .prompt-actions button {
      width: 36px;
      height: 36px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #59665E;
      transition: color var(--transition), background var(--transition), border-color var(--transition);
    }
    .prompt-actions button:hover {
      color: var(--text);
      background: var(--surface2);
      border-color: var(--border-subtle);
    }
    .prompt-actions button.delete:hover {
      color: var(--danger);
      background: #FDEDEA;
      border-color: #F4C9C4;
    }
    .prompt-actions button svg { width: 15px; height: 15px; }

    .empty {
      padding: 34px 20px;
      border: 1px dashed #D3DCD5;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.55);
      color: #59665E;
    }
    .empty .empty-icon { margin-bottom: 8px; color: #78877D; }
    .empty p { font-size: 12px; line-height: 1.55; }
    .empty b { color: var(--text); font-weight: 650; }

    .footer { margin-top: 14px; }
    .btn-add {
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 11px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 650;
      transition: background var(--transition), box-shadow var(--transition);
    }
    .btn-add:hover { background: var(--accent-hover); }
    .btn-add:focus-visible { box-shadow: 0 0 0 3px var(--ring); }
    .btn-add:active { background: #064A3C; }

    .quick-add {
      gap: 14px;
      padding: 18px;
      margin-top: 14px;
      border-color: var(--border-subtle);
      border-radius: 12px;
      background: var(--surface);
    }
    .quick-add label {
      margin-bottom: 5px;
      color: #4F5C53;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
    }
    .quick-add input, .quick-add textarea {
      min-height: 42px;
      padding: 9px 11px;
      border-color: var(--border-subtle);
      border-radius: 9px;
      background: #FBFCFA;
      color: var(--text);
      font-size: 13px;
    }
    .quick-add input::placeholder, .quick-add textarea::placeholder { color: #66756B; }
    .quick-add input:focus, .quick-add textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .quick-add textarea { min-height: 82px; }
    .quick-add .row { gap: 12px; }
    .quick-add .row > div { min-width: 0; }
    .quick-add .btn-row { gap: 7px; }
    .quick-add .btn-row button {
      min-height: 40px;
      padding: 8px 15px;
      border-radius: 9px;
      font-size: 12px;
      transition: background var(--transition), color var(--transition);
    }
    .btn-save { background: var(--accent); color: #FFFFFF; }
    .btn-save:hover { background: var(--accent-hover); }
    .btn-cancel { color: #4F5C53; border-color: var(--border-subtle) !important; }
    .btn-cancel:hover { background: var(--surface2); color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </span>
      PromptSaver
    </h1>
    <button class="settings-link" id="openSettings" type="button" title="Settings" aria-label="Open settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div id="siteBadge" class="site-badge inactive">
    <span class="dot"></span>
    <span id="siteLabel">Not active on this site</span>
  </div>

  <div class="search-wrap">
    <span class="icon" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" id="search" placeholder="Search prompts…" aria-label="Search prompts" />
  </div>

  <ul class="prompt-list" id="promptList"></ul>
  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    </div>
    <p>No prompts yet.<br/>Click <b>Add Prompt</b> to create one.</p>
  </div>

  <!-- Quick-add form -->
  <div class="quick-add" id="quickAdd">
    <div class="row">
      <div>
        <label for="qaName">Name</label>
        <input type="text" id="qaName" placeholder="e.g. Explain" />
      </div>
      <div>
        <label for="qaTrigger">Trigger</label>
        <input type="text" id="qaTrigger" placeholder="e.g. !E" />
      </div>
    </div>
    <div>
      <label for="qaBody">Prompt text</label>
      <textarea id="qaBody" placeholder="Enter your prompt…"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" id="qaCancel">Cancel</button>
      <button class="btn-save" id="qaSave">Save</button>
    </div>
  </div>

  <div class="footer">
    <button class="btn-add" id="btnAdd">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Prompt
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
